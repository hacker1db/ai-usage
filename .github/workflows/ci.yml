name: ci

# The checks every change must pass. Runs on pull requests and is called by release.yml before
# anything is tagged. A caller must grant statuses: write for the lint job's per-linter statuses.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # make check runs govulncheck because it is now on PATH.
      - name: make check
        run: make check

  # Unit-test coverage with the internal/gateway floor; the HTML report is kept as an artifact.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make coverage
        run: |
          set -o pipefail
          make coverage | tee coverage-summary.txt
          {
            echo '### Unit-test coverage'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.html
            coverage.out
          retention-days: 14

  # End to end: the real ai-gateway and ai-usage binaries against fake upstreams, driven by raw
  # HTTP and by the official OpenAI and Anthropic SDKs (test/sdk, pinned by its lockfile).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install SDKs
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix test/sdk
      - name: make test-integration
        run: make test-integration
      - name: Summary
        if: always()
        run: |
          {
            echo '### Integration tests'
            echo '```text'
            grep -E -- '^\s*--- (PASS|FAIL|SKIP)|^\s+(ok|FAIL) ' test-integration.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-log
          path: test-integration.log
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Linter configs live in .github/linters/. Listing validators turns every other one off.
      - name: super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GO_MODULES: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_YAML: true
      # Type-checks the dashboard script (it carries // @ts-check) with a pinned TypeScript.
      - name: Type-check app.js
        run: make typecheck-js
